<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servidores | Noctua</title>
    <link rel="stylesheet" href="/styles/dash-style.css">
    <link rel="stylesheet" href="/styles/dashboard-sidebar.css">
    <link rel="stylesheet" href="/styles/editar-usuario.css">
    <link rel="stylesheet" href="/styles/dash-servidores.css">
    <link rel="icon" href="/assets/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>

<body class="pagina-servidores pagina-dashboard">
    <!-- Sidebar -->
    <aside class="sidebar" data-dashboard-sidebar="dash-servidores.html"></aside>

    <div class="main-wrapper" id="container_main" onclick="fecharEditarUsuario()">
        <main class="dashboard-servidores">
            <header class="servidores-cabecalho">
                <h1>Visão geral das mainframes</h1>
                <p class="servidores-atualizacao">Última coleta: <time id="data-atualizacao" title="Horário da última coleta disponível">—</time></p>
            </header>

            <section class="servidores-indicadores" aria-label="Resumo das mainframes" aria-live="polite">
                <article class="servidores-indicador">
                    <h2>Mainframes cadastradas</h2>
                    <p class="servidores-total" id="total-mainframes">—</p>
                </article>
                <article class="servidores-indicador">
                    <h2>Status cadastral</h2>
                    <div class="servidores-status-resumo">
                        <div><span class="status-marcador marcador-ativo" aria-hidden="true"></span><p><strong id="total-ativas">—</strong><span>Ativas</span></p></div>
                        <div><span class="status-marcador marcador-inativo" aria-hidden="true"></span><p><strong id="total-inativas">—</strong><span>Inativas</span></p></div>
                        <div><span class="status-marcador marcador-manutencao" aria-hidden="true"></span><p><strong id="total-manutencao">—</strong><span>Em manutenção</span></p></div>
                    </div>
                </article>
            </section>

            <section class="servidores-listagem" aria-labelledby="titulo-listagem">
                <div class="servidores-filtros">
                    <h2 id="titulo-listagem">Mainframes</h2>
                    <div class="servidores-controles">
                        <div class="servidores-busca">
                            <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                            <input type="search" id="busca-hostname" placeholder="Buscar hostname" aria-label="Buscar hostname">
                        </div>
                        <select id="filtro-localizacao" aria-label="Filtrar por localização"><option value="">Todas as localizações</option></select>
                        <select id="filtro-status" aria-label="Filtrar por status">
                            <option value="">Todos os status</option>
                            <option value="ativo">Ativo</option>
                            <option value="inativo">Inativo</option>
                            <option value="manutenção">Manutenção</option>
                        </select>
                    </div>
                </div>
                <p class="servidores-erro" id="erro-servidores" role="alert" hidden></p>
                <div class="servidores-tabela">
                    <table aria-label="Mainframes da empresa">
                        <thead><tr>
                            <th scope="col">Hostname</th>
                            <th scope="col">Porcentagem CPU</th>
                            <th scope="col">Porcentagem Disco</th>
                            <th scope="col">Porcentagem RAM</th>
                            <th scope="col">Porcentagem SWAP</th>
                            <th scope="col">Sistema operacional</th>
                            <th scope="col">Componentes</th>
                            <th scope="col">Status</th>
                            <th scope="col">Ações</th>
                        </tr></thead>
                        <tbody id="lista-mainframes"><tr><td colspan="6" class="servidores-vazio">Carregando mainframes...</td></tr></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="editar-usuario" style="display: none;"></div>

    <script src="/js/api.js"></script>
    <script src="/js/monitoramento.js"></script>
    <script src="/js/dashboard-sidebar.js"></script>
    <script src="/js/user-sidebar.js"></script>
    <script src="/js/editar-usuario.js"></script>
    <script src="/js/dash-servidores.js"></script>
</body>

</html>
