<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configurações - Funcionários</title>
  <link rel="stylesheet" href="/styles/cadastro-func.css">
  <link rel="stylesheet" href="/styles/editar-usuario.css">
  <link rel="icon" href="/assets/icon.png">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body onload="verificarPermissao()">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <a href="dash-servidores.html">
        <img class="logo" src="/assets/noctua-logo-branca.png" alt="Noctua Logo">
      </a>
    </div>

    <ul class="sidebar-menu">
      <li><a href="dash-servidores.html"><i class="fa-solid fa-server"></i>Servidores</a></li>
      <li><a href="dash-alertas.html"><i class="fa-solid fa-triangle-exclamation"></i>Alertas</a></li>
      <li><a href="mainframes.html"><i class="fa-solid fa-pen-to-square"></i>Editar Servidores</a></li>
      <li><a href="cargos.html"><i class="fa-solid fa-user-tag"></i>Cargos</a></li>
      <li><a href="cadastro-func.html"class="active"><i class="fa-solid fa-users"></i>Usuários</a></li>
    </ul>

    <div class="sidebar-user">
      <a href="#" onclick="abrirEditarUsuario(); return false;" aria-label="Editar meu perfil">
        <div class="user-avatar"><span id="user-avatar">-</span></div>
        <div class="user-info">
          <span id="user-name">-</span>
          <span id="user-role">-</span>
        </div>
      </a>
      <a href="index.html" aria-label="Sair">
        <i class="fa-solid fa-right-from-bracket" style="color:rgb(255,102,102);"></i>
      </a>
    </div>
  </aside>

   <main class="main" id="container_main" onclick="fecharEditarUsuario()">
    <section class="panel users-column" aria-label="Lista de usuários">
      <h1 class="panel-title">Usuários</h1>
      <div class="scrollable-area" id="lista_usuarios"></div>
    </section>

    <section class="roles-column" aria-label="Atribuição de cargos">
      <div class="panel roles-panel">
        <h2 class="panel-title">Atribuir Cargos</h2>

        <div class="roles-panel-inner">
          <div class="user-header-info">
            <div class="info-line">
              <span class="card-label">USUARIO:</span>
              <span id="sel_nome">-</span>
            </div>
            <div class="info-line">
              <span class="card-label">EMPRESA:</span>
              <span id="sel_empresa">-</span>
            </div>
            <div class="info-line">
              <span class="card-label">EMAIL:</span>
              <span id="sel_email">-</span>
            </div>
          </div>

          <hr class="divider">

          <div class="scrollable-area roles-list" id="lista_cargos"></div>
        </div>
      </div>

      <div class="action-buttons">
        <button type="button" class="btn btn-delete" id="excluirConta">Deletar usuário</button>
        <button type="button" class="btn btn-update" id="atualizarConta">Atualizar usuário</button>
      </div>
    </section>
  </main>

  <div id="editar-usuario" style="display: none;"></div>
  <script src="/js/api.js"></script>
  <script src="/js/user-sidebar.js"></script>
  <script src="/js/editar-usuario.js"></script>
  <script src="/js/cadastro-func.js"></script>
</body>

</html>
