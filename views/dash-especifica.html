<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Nome Servidor</title>
    <link rel="stylesheet" href="/styles/dash-especifica.css">
    <link rel="stylesheet" href="/styles/editar-usuario.css">
    <link rel="icon" href="/assets/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
        integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
        <a href="dash-servidores.html">
            <img class="logo" src="/assets/noctua-logo-branca.png" alt="Noctua Logo">
        </a>
        </div>

        <ul class="sidebar-menu">
        <li><a href="dash-servidores.html" class="active" aria-current="page"><i class="fa-solid fa-server"></i>Servidores</a></li>
        <li><a href="dash-alertas.html"><i class="fa-solid fa-triangle-exclamation"></i>Alertas</a></li>
        <li><a href="mainframes.html"><i class="fa-solid fa-pen-to-square"></i>Editar Servidores</a></li>
        <li id="cargos-html" class="hidden"><a href="cargos.html"><i class="fa-solid fa-user-tag" aria-hidden="true"></i>Cargos</a></li>
        <li id="funcionarios-html" class="hidden"><a href="cadastro-func.html"><i class="fa-solid fa-users" aria-hidden="true"></i>Usuários</a></li>
        </ul>

        <div class="sidebar-user">
        <a href="#" onclick="abrirEditarUsuario(); return false;" aria-label="Editar meu perfil">
            <div class="user-avatar"><span id="user-avatar">-</span></div>
            <div class="user-info">
            <span id="user-name">-</span>
            <span id="user-role">-</span>
            </div>
        </a>
        <a href="index.html" aria-label="Sair">
            <i class="fa-solid fa-right-from-bracket" style="color:rgb(255,102,102);"></i>
        </a>
        </div>
    </aside>

    <main id="container_main" onclick="fecharEditarUsuario()">
        <section class="navbar">
            <h2 class="nome-mainframe" id="nomeMainframe">
                Detalhes do Servidor: 
            </h2>

            <div class="status-mainframe" id="statusMainframe">
            </div>
        </section>

        <section class="opcoes-monitoramento">
            <ul>
                <li>
                    <button class="opcao-monitoramento opcao-monitoramento-selecionada">
                        Geral (Visão Geral)

                    </button>
                </li>
                <li>
                    <button class="opcao-monitoramento">
                        Rede e Conectividade

                    </button>
                </li>
                <li>
                    <button class="opcao-monitoramento">
                        Processador (CPU)

                    </button>
                </li>
                <li>
                    <button class="opcao-monitoramento">
                        Memória RAM & SWAP

                    </button>
                </li>
                <li>
                    <button class="opcao-monitoramento">
                        Armazenamento (Disco)

                    </button>
                </li>
            </ul>
        </section>

        <section class="sessao-kpis">
        </section>

        <section class="sessao-grafio">
            <div class="parte-acima">
                <h2 class="tituloGrafico"></h2>

                <div class="opcoes-tempo">
                    <button class="opcao-tempo opcao-tempo-selecionada">
                        1h
                    </button>

                    <button class="opcao-tempo">
                        12h
                    </button>

                    <button class="opcao-tempo">
                        24h
                    </button>

                    <button class="opcao-tempo">
                        7 dias
                    </button>
                </div>
            </div>

            <canvas id="grafico"></canvas>
        </section>

        <section class="sessao-historico">
             <table>
                <thead>
                    <tr class="titulo-grafico">
                        <th>Data e Hora</th>
                        <th>Componente</th>
                        <th>Métrica</th>
                        <th>Valor Capturado</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                </tbody>
        </section>
    </main>
    
<div id="editar-usuario" style="display: none;"></div>
<script src="/js/api.js"></script>
<script src="/js/user-sidebar.js"></script>
<script src="/js/editar-usuario.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/js/dash-especifca.js"></script>

</body>
</html>
