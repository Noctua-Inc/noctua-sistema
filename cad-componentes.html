<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="cad-comp-style.css">
    <link rel="icon" href="assets/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- SIDEBAR FIXA -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            Dashboard
        </div>
        <ul class="sidebar-menu">
            <li><a href="dashboard.html" >Visão Geral</a></li>
            <li><a href="#">Servidores</a></li>
            <li><a href="#">Cadastro de Servidores</a></li>
            <li><a href="cad-componentes.html" class="active">Cadastro de Componentes</a></li>
            <li><a href="#">Configurações</a></li>
        </ul>
    </aside>

    <!-- WRAPPER COM ROLAGEM DO CONTEÚDO -->
    <div class="main-wrapper">
        <main class="content">
            <h1>Cadastrar um Componente</h1>

            <div class="conteudo-form">

                <div class="selects">
                    <label>Selecione o Mainframe correspondente:</label>
                    <select id="mainframe" name="mainframe_escolhido">
                        <option value="m1" selected>Mainframe001</option>
                        <option value="m2">Mainframe002</option>
                        <option value="m3">Mainframe003</option>
                    </select>
                </div>

                <div class="selects">
                    <label>Selecione o Componente que deseja cadastrar:</label>
                    <select id="componente" name="componente_escolhido">
                        <option value="cpu" selected>CPU</option>
                        <option value="ram">RAM</option>
                        <option value="disco">Disco</option>
                    </select>
                </div>

                <div>
                    <label for="capacidade">Capacidade Total:</label>
                    <input type="text" id="capacidade" name="capacidade" placeholder="Ex: 12000 MIPS, 256 GB, 2 TB" required>
                </div>

                <div>
                    <label for="alerta-aviso">Limiar de Alerta (Aviso %):</label>
                    <input type="number" id="alerta-aviso" name="alerta_aviso" placeholder="Ex: 80" min="0" max="100" required>
                </div>

                <div>
                    <label for="alerta-critico">Limiar de Alerta (Crítico %):</label>
                    <input type="number" id="alerta-critico" name="alerta_critico" placeholder="Ex: 95" min="0" max="100" required>
                </div>

            </div>

            <div class="botao">
                <button type="submit" class="btn-submit">Cadastrar Componente</button>
            </div>
        </main>
        
    </div>
</body>
</html>
